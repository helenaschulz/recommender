[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender"
version = "0.3.0"
description = "Book recommender project on the Book-Crossing dataset"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Data prep, evaluation, notebooks
    "pandas==3.0.5",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "matplotlib==3.11.1",
    "jupyter==1.1.1",
    "tabulate==0.9.0",     # DataFrame.to_markdown for ledger and gallery output
    # Models
    "scikit-learn==1.9.0",   # TF-IDF vectorizer
    "implicit==0.7.3",       # ALS / weighted matrix factorization
    "sentence-transformers==5.6.1",
    "torch==2.13.0",         # CPU/MPS backend for sentence-transformers
    # The demo app (M13). Streamlit brings pyarrow, which is what the app assets are
    # stored in — the metadata table loads in milliseconds instead of parsing 30 MB of CSV
    # on every cold start.
    "streamlit==1.61.1",
    "pyarrow==24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
    # Only for scripts/capture_app_screenshots.py. Needs its browser once:
    # python -m playwright install chromium
    "playwright==1.62.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
